name: Build e Deploy no Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/brun0la/login

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build nativo (GraalVM + Alpine) e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # o Render só roda amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy no Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado; pulando deploy."
            exit 0
          fi
          # publica exatamente a imagem deste commit (URL-encoded: / -> %2F, : -> %3A)
          IMG_URL="docker.io%2Fbrun0la%2Flogin%3A${GITHUB_SHA}"
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=${IMG_URL}"
          echo "Deploy disparado."

